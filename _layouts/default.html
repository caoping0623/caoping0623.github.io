<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){mermaid.initialize({startOnLoad:true,theme:"base",themeVariables:{primaryColor:"#c8b8e4",primaryTextColor:"#3d3556",primaryBorderColor:"#b49bc8",lineColor:"#a0888c",secondaryColor:"#b8dcd8",tertiaryColor:"#f8e8c8",edgeLabelBackground:"#faf7f2",clusterBkg:"#f4f0fb",clusterBorder:"#d0bce0",titleColor:"#3d3556",nodeBorder:"#b49bc8",mainBkg:"#f0eaf8",fontFamily:"Inter,'PingFang SC','Microsoft YaHei',sans-serif"}});function shrinkArrows(){document.querySelectorAll('.mermaid marker:not([data-scaled])').forEach(function(m){['markerWidth','markerHeight'].forEach(function(a){var v=parseFloat(m.getAttribute(a));if(v>0)m.setAttribute(a,(v*0.5).toFixed(1));});m.setAttribute('data-scaled','1');});}var mo=new MutationObserver(shrinkArrows);document.querySelectorAll('.mermaid').forEach(function(el){mo.observe(el,{childList:true,subtree:true});});});</script>
</head>
<body>
<div class="site-wrapper">

  <header class="site-header">
    <div class="container">
      <nav class="nav-inner" id="nav-inner">
        <a href="{{ '/' | relative_url }}" class="site-logo">⚡ {{ site.title }}</a>
        <ul class="nav-links">
          {% for item in site.nav %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a></li>
          {% endfor %}
          <li>
            <button type="button" class="nav-search-btn" id="nav-search-btn" aria-label="搜索文章" aria-expanded="false">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21"/>
              </svg>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
      <p>© {{ 'now' | date: "%Y" }} {{ site.author.name }} · 用代码构建美好世界</p>
    </div>
  </footer>

</div>

<!-- Search overlay. Deliberately a sibling of .site-wrapper: kept out of the
     header so nothing in the nav reflows when it opens, and so position:fixed
     is not captured by the header's backdrop-filter containing block. -->
<div class="site-search" id="site-search">
  <div class="site-search-box">
    <svg class="site-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
    <input type="text" class="site-search-input" id="site-search-input"
           placeholder="搜索文章标题…" autocomplete="off" spellcheck="false"
           aria-label="按标题搜索文章">
    <button type="button" class="site-search-close" id="site-search-close" aria-label="关闭搜索">×</button>
  </div>
  <div class="site-search-results" id="site-search-results" role="listbox"></div>
</div>

<script>
/* Title index, newest first. Small enough to inline; no plugin needed. */
var SITE_POSTS = [
{%- for post in site.posts %}
  { t: {{ post.title | jsonify }}, u: {{ post.url | relative_url | jsonify }}, c: {{ post.categories | first | default: "" | jsonify }}, d: {{ post.date | date: "%Y-%m-%d" | jsonify }} }{% unless forloop.last %},{% endunless %}
{%- endfor %}
];

(function () {
  var panel    = document.getElementById('site-search');
  var btn      = document.getElementById('nav-search-btn');
  var closeBtn = document.getElementById('site-search-close');
  var input    = document.getElementById('site-search-input');
  var results  = document.getElementById('site-search-results');
  if (!panel || !btn || !input || !results) return;

  var MAX_SHOWN = 10;
  var shown = [];      /* posts currently listed */
  var active = -1;     /* keyboard cursor into `shown` */

  function open() {
    panel.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    input.focus();
    input.select();
    if (input.value.trim()) update();
  }

  function close() {
    panel.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    input.blur();
    results.classList.remove('has-results');
    results.innerHTML = '';
    shown = [];
    active = -1;
  }

  function isOpen() { return panel.classList.contains('open'); }

  /* Split the query into keywords; every keyword must appear in the title. */
  function keywordsOf(q) {
    return q.toLowerCase().split(/\s+/).filter(function (k) { return k.length > 0; });
  }

  function match(keys) {
    var hits = [];
    for (var i = 0; i < SITE_POSTS.length; i++) {
      var p = SITE_POSTS[i];
      var lower = p.t.toLowerCase();
      var ok = true;
      for (var j = 0; j < keys.length; j++) {
        if (lower.indexOf(keys[j]) === -1) { ok = false; break; }
      }
      if (ok) hits.push({ p: p, at: lower.indexOf(keys[0]) });
    }
    /* Earlier match first; SITE_POSTS order (newest first) breaks ties. */
    hits.sort(function (a, b) { return a.at - b.at; });
    return hits.map(function (h) { return h.p; });
  }

  /* Build text nodes + <mark> by hand so titles are never parsed as HTML. */
  function highlight(el, text, keys) {
    var lower = text.toLowerCase();
    var spans = [];
    keys.forEach(function (k) {
      var from = 0, at;
      while ((at = lower.indexOf(k, from)) !== -1) {
        spans.push([at, at + k.length]);
        from = at + k.length;
      }
    });
    spans.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [];
    spans.forEach(function (s) {
      var last = merged[merged.length - 1];
      if (last && s[0] <= last[1]) last[1] = Math.max(last[1], s[1]);
      else merged.push([s[0], s[1]]);
    });
    var pos = 0;
    merged.forEach(function (s) {
      if (s[0] > pos) el.appendChild(document.createTextNode(text.slice(pos, s[0])));
      var mk = document.createElement('mark');
      mk.textContent = text.slice(s[0], s[1]);
      el.appendChild(mk);
      pos = s[1];
    });
    if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
  }

  function setActive(i) {
    active = i;
    var items = results.querySelectorAll('.site-search-item');
    for (var k = 0; k < items.length; k++) {
      items[k].classList.toggle('is-active', k === i);
    }
    if (i >= 0 && items[i]) items[i].scrollIntoView({ block: 'nearest' });
  }

  function update() {
    var q = input.value.trim();
    var keys = keywordsOf(q);
    results.innerHTML = '';
    active = -1;

    if (!keys.length) {
      shown = [];
      results.classList.remove('has-results');
      return;
    }

    var hits = match(keys);
    shown = hits.slice(0, MAX_SHOWN);
    results.classList.add('has-results');

    if (!hits.length) {
      var empty = document.createElement('p');
      empty.className = 'site-search-empty';
      empty.textContent = '没有标题匹配「' + q + '」';
      results.appendChild(empty);
      return;
    }

    /* One row per article: title on a single line, meta pinned to the right. */
    shown.forEach(function (p) {
      var a = document.createElement('a');
      a.className = 'site-search-item';
      a.href = p.u;
      a.setAttribute('role', 'option');
      a.title = p.t;

      var title = document.createElement('span');
      title.className = 'site-search-title';
      highlight(title, p.t, keys);

      var meta = document.createElement('span');
      meta.className = 'site-search-meta';
      meta.textContent = (p.c ? p.c + ' · ' : '') + p.d;

      a.appendChild(title);
      a.appendChild(meta);
      results.appendChild(a);
    });

    if (hits.length > shown.length) {
      var more = document.createElement('p');
      more.className = 'site-search-more';
      more.textContent = '另有 ' + (hits.length - shown.length) + ' 篇匹配，继续输入以缩小范围';
      results.appendChild(more);
    }
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    isOpen() ? close() : open();
  });

  closeBtn && closeBtn.addEventListener('click', close);

  input.addEventListener('input', update);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { close(); return; }
    if (!shown.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive((active + 1) % shown.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive((active - 1 + shown.length) % shown.length);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      window.location.href = shown[active >= 0 ? active : 0].u;
    }
  });

  document.addEventListener('click', function (e) {
    if (isOpen() && !panel.contains(e.target) && !btn.contains(e.target)) close();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen()) close();
  });
}());
</script>
</body>
</html>
