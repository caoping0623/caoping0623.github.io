title: "Cao Ping 的技术博客"
description: "分享技术心得、编程经验与学习笔记"
author:
  name: "Cao Ping"
  email: ""
  github: "caoping0623"

url: "https://caoping0623.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination
paginate: 10
paginate_path: "/page/:num/"

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Cao Ping"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Private category (categories: others) — expanding that folder in the homepage
# TOC requires this password. Articles themselves are not gated after unlock.
# Change password:
#   node -e "console.log(require('crypto').createHash('sha256').update('新密码','utf8').digest('hex'))"
# Default password: @amycao0623
finance_lock:
  enabled: true
  category: "others"
  password_hash: "6dd3782da46491aab3b2140875a3ee2fd1c491293e60a13ff440818792d9b2ef"

# Navigation
nav:
  - title: "首页"
    url: "/"
  - title: "关于"
    url: "/about/"
