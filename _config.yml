title: "Cao Ping 的技术博客"
description: "分享技术心得、编程经验与学习笔记"
author:
  name: "Cao Ping"
  email: ""
  github: "caoping0623"

url: "https://caoping0623.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination
paginate: 10
paginate_path: "/page/:num/"

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Cao Ping"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Finance articles (categories: 财经) require this password in the browser.
# Option A: casual gate only — markdown remains in the public repo.
# Change password: node -e "console.log(require('crypto').createHash('sha256').update('新密码','utf8').digest('hex'))"
# then paste the hex into password_hash below. Default password: caoping-finance
finance_lock:
  enabled: true
  password_hash: "1d1a5e9679ca2b17e11361df490428da7c2e6b55634ffa3d564ffafedc3d7d70"

# Navigation
nav:
  - title: "首页"
    url: "/"
  - title: "关于"
    url: "/about/"
